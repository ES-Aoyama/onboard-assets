<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- ボード（乗り込む板） -->
  <rect x="96" y="352" width="320" height="40" rx="20" fill="#ffffff" opacity="0.9"/>
  <!-- 乗り込む矢印 -->
  <path d="M148 300 L256 180 L364 300" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 190 L256 330" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
  <!-- 開始月・終了月を表す 2 つの点 -->
  <circle cx="156" cy="372" r="14" fill="#2563eb"/>
  <circle cx="356" cy="372" r="14" fill="#2563eb"/>
</svg>
